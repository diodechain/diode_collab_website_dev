# General Settings
name: Diode
title: Diode&#8482;
description: Diode enables digital sovereignty in everyday interactions.
url: https://collab.diode.io


# Theme Settings
theme: minima
minima:
  date_format: "%b %-d, %Y"
sass:
  style: compressed
plugins:
# - jekyll-feed
- jekyll-paginate
- jekyll-seo-tag
- jekyll-redirect-from
- jekyll-sitemap


# Path
path:
  images: "/assets/img/"
  styles: "/assets/css/"
  scripts: "/assets/js/"
  favicon: "/assets/favicon/"


# Navigation
nav:
- title: Pricing
  url: "/pricing/"
- title: Stories
  url: "/blog/"
- title: Docs
  url: "https://docs.diode.io/"
  target: _blank
- title: Support
  url: "/joinzone/?zone=Support#GZF6Mm8FE23omWQ53l4S-pzr2V3LYPlLncupAbPCXnDU9biiaFDTc8sJJwsM"
- title: Learn More
  url: "/about/"
- title: Download
  url: "/download/"

# Form Handler URLs — change once here (same pattern as download.app below).
forms:
  contact: "https://diodeforms.diode.link/f/contact?source=collab.diode.io"
  demo: "https://diodeforms.diode.link/f/demo?source=collab.diode.io"
  affiliate_interest: "https://diodeforms.diode.link/f/affiliate_interest?source=collab.diode.io"
  affiliate_lead: "https://diodeforms.diode.link/f/affiliate_lead?source=collab.diode.io"
  vault_waitlist: "https://diodeforms.diode.link/f/vault_waitlist?source=collab.diode.io"
  source: "collab.diode.io"

# Other Links
links:
  download:
    title: Get the App
    url: "/download/"
  node:
    title: Run a Node
    url: "https://network.docs.diode.io/docs/"
  terms:
